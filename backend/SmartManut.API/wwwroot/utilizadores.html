<main class="main-content"><h2><i class="fa-solid fa-users"></i> Gestão de Utilizadores</h2>
<div class="card"><h3>Registar Novo Utilizador</h3><form id="formDados"><div class="form-row">
<div class="form-group"><label>Nome</label><input type="text" id="nome" required placeholder="Ex: João Silva"></div>
<div class="form-group"><label>Email</label><input type="email" id="email" required placeholder="Ex: joao@email.com"></div>
</div><div class="form-row">
<div class="form-group"><label>Perfil de Acesso</label><select id="perfilId" required></select></div>
</div><button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Salvar Utilizador</button></form></div>
<div class="card"><h3>Utilizadores Registados</h3><table><thead><tr><th>ID</th><th>Nome</th><th>Email</th><th>Perfil ID</th></tr></thead><tbody id="tabelaDados"></tbody></table></div>
