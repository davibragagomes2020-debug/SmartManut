<body>
<nav class="sidebar"><div class="sidebar-brand"><i class="fa-solid fa-cogs"></i> SmartManut</div><ul class="sidebar-menu">
<li><a href="index.html"><i class="fa-solid fa-wrench"></i> Equipamentos</a></li>

</ul></nav>
<main class="main-content"><h2><i class="fa-solid fa-file-lines"></i> Gestão de Ordens de Serviço</h2>
<div class="card"><h3>Registar Nova Ordem de Serviço</h3><form id="formDados"><div class="form-row">
<div class="form-group"><label>Tipo</label><select id="tipo"><option value="Corretiva">Corretiva</option><option value="Preventiva">Preventiva</option></select></div>
<div class="form-group"><label>Prioridade</label><select id="prioridade"><option value="Alta">Alta</option><option value="Média">Média</option><option value="Baixa">Baixa</option></select></div>
<div class="form-group"><label>Equipamento</label><select id="equipamentoId" required></select></div>
</div><div class="form-row">
<div class="form-group" style="grid-column: span 2;"><label>Descrição do Problema</label><input type="text" id="descricaoProblema" required placeholder="Ex: Ruído excessivo no motor"></div>
</div><button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Salvar Ordem</button></form></div>
<div class="card"><h3>Ordens Registadas</h3><table><thead><tr><th>ID</th><th>Tipo</th><th>Descrição</th><th>Status</th><th>Prioridade</th><th>Equipamento ID</th></tr></thead><tbody id="tabelaDados"></tbody></table></div>
</main><script src="js/ordens.js"></script></body></html>
